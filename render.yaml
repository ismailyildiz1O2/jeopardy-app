services:
  - type: web
    name: jeopardy-backend
    runtime: node
    region: ohio
    buildCommand: npm install --workspace=packages/backend && npm run build --workspace=packages/backend
    startCommand: node packages/backend/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
