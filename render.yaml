services:
  - type: web
    name: jeopardy-backend
    runtime: node
    region: ohio
    buildCommand: cd packages/backend && npm install && npm run build
    startCommand: cd packages/backend && node dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: NODE_ENV
        value: production
